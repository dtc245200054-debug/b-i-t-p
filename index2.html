<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Internal Style CSS</title>
    
    <!-- Định nghĩa CSS bên trong thẻ <style> -->
    <style>
        h1 {
            color: crimson;
        }
        p {
            color: darkorange;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>Tiêu đề trang web (Internal Style)</h1>
    <p>Đây là đoạn văn bản ví dụ sử dụng Internal Style để thay đổi màu sắc.</p>

</body>
</html>
