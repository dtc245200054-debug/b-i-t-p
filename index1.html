<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Inline Style CSS</title>
</head>
<body>

    <!-- CSS Inline được viết trực tiếp vào thẻ h1 và p -->
    <h1 style="color: blue;">Tiêu đề trang web (Inline Style)</h1>
    <p style="color: green; font-size: 18px;">Đây là đoạn văn bản ví dụ sử dụng Inline Style để thay đổi màu sắc.</p>

</body>
</html>
